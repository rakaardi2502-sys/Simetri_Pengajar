<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"> </script>
    <link rel="stylesheet" href="D-Day.css">
</head>
<body>
    <main class="bg-black text-white">
        <!-- Section 1 - Hero -->
        <section id="hero" class="bg-[red] text-center py-[100px]">
            <h1 class="font-zelda text-center text-[128px]">My Portfolio</h1>
            <p class="px-[100px] text-[32px]">Raka Ardi Wiguna</p>
        </section>

        <!-- Section 2 - About me -->
        <section>
            <h2 class="font-zelda text-center text-[80px]">About Me</h2>
            <p class="px-[100px] text-center text-[32px]">Halo semua aku Raka, aku dari ITS jurusan Sistem Informasi, aku suka ngoding dan belajar.</p>

        </section>

        <!-- Section 3 - My Skills -->
        <section id="myskills" class="text-left w-[600px] mx-auto p-[60px]">
            <h2 class="font-zelda text-center text-[80px]">My Skills</h2>
            <div>
                <h3 class="font-zelda text-[48px]">Aku tertarik dengan mata kuliah yang ada di sisfor</h3>
                <ul class="text-[32px] list-inside list-disc">
                    <li>Matematika</li>
                    <li>Fisika</li>
                    <li>Kimia</li>
                </ul>
            </div>
            

        </section>

        <!-- Section 4 -  My Experience -->
        <section id="Experience" class="py-[100px]">
            <div>
                <h2 class="font-zelda text-[128px] text-white text-shadow-[0_5px_0_#7A3D21] text-center">My Experience</h2>
            
                <img src="images/fotoku/foto1.png" alt="Deskripsi foto 1">
                <img src="images/fotoku/foto2.png" alt="Deskripsi foto 2">
                <img src="images/fotoku/foto3.png" alt="Deskripsi foto 3">
                <img src="images/fotoku/foto4.png" alt="Deskripsi foto 4">
            </div>
        </section>
    </main>
</body>
</html>
