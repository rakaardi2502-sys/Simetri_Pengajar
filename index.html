<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slicing Pengajar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/css/global.css" />
</head>

<body class="font-zelda">
    <!-- start navbar -->
    <header class="sticky top-0 z-[60]">
        <nav
            class="relative z-[60] flex items-center justify-between backdrop-filter backdrop-blur-md bg-opacity-40 px-6 md:px-16 lg:px-[90px] h-[90px]">
            <!-- left side -->
            <div class="flex flex-row items-center gap-15">
                <img class="h-12 lg:h-14 w-auto" src="/images/navbar/navbar-logo.svg" alt="Home" />
                <!-- lg screen only -->
                <ul class="hidden lg:flex lg:flex-row gap-[64px] text-white text-[2rem]">
                    <a class="text-[#F3B641] underline" href="">Home</a>
                    <a class="hover:underline" href="">Tema</a>
                    <a class="hover:underline" href="">Materi</a>
                    <a class="hover:underline" href="">Asik</a>
                </ul>
            </div>

            <div class="flex flex-row items-center gap-3">
                <!-- right side -->
                <div class="hidden lg:flex lg:flex-row items-center gap-[15px]">
                    <!-- lg screen -->
                    <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70" href=""
                        target="_blank"><img class="w-11" src="/images/navbar/x-logo.svg" alt="X" /></a>
                    <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70" href=""
                        target="_blank"><img class="w-11" src="/images/navbar/tiktok-logo.svg" alt="TikTok" /></a>
                    <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70" href=""
                        target="_blank"><img class="w-11" src="/images/navbar/ig-logo.svg" alt="Instagram" /></a>
                    <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70" href=""
                        target="_blank"><img class="w-11" src="/images/navbar/yt-logo.svg" alt="Youtube" /></a>
                </div>
                <!-- sm screen -->
                <button id="hamburgerBtn"
                    class="flex lg:hidden items-center justify-center w-[48px] h-[48px] bg-[#4C1C0E] rounded-lg z-[60]">
                    <img id="iconHamburger" src="/images/navbar/menu.svg" alt="hamburger"
                        class="h-[38.97px] w-[38.97px]" />
                    <img id="iconClose" src="/images/navbar/exit.svg" alt="hamburger"
                        class="h-[38.97px] w-[38.97px] hidden" />
                </button>
            </div>
        </nav>

        <!-- sm screen sidebar -->
        <div id="mobileMenu"
            class="lg:hidden backdrop-filter backdrop-blur-md bg-opacity-40 fixed inset-0 translate-x-full z-[50] transition-transform duration-250 ease-in-out">
            <div class="h-[90px] flex items-center px-6"></div>

            <!-- nav texts -->
            <ul class="flex flex-col items-center text-center py-6 text-white text-[2rem]">
                <li class="w-full text-[#F9DCB4] py-4">
                    <a class="underline" href="">Home</a>
                </li>
                <li class="w-full py-4">
                    <a class="" href="">Tema</a>
                </li>
                <li class="w-full py-4">
                    <a class="" href="">Materi</a>
                </li>
                <li class="w-full py-4">
                    <a class="" href="">Asik</a>
                </li>
            </ul>

            <!-- icons -->
            <div class="flex flex-row items-center justify-center gap-4">
                <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70"
                    href="https://x.com/HMSI_ITS" target="_blank"><img class="w-11 text-[#C07E4E]"
                        src="/images/navbar/x-logo.svg" alt="X" /></a>
                <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70"
                    href="https://www.tiktok.com/@hmsi_its" target="_blank"><img class="w-11"
                        src="/images/navbar/tiktok-logo.svg" alt="TikTok" /></a>
                <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70"
                    href="https://www.instagram.com/hmsi_its" target="_blank"><img class="w-11"
                        src="/images/navbar/ig-logo.svg" alt="Instagram" /></a>
                <a class="transition duration-200 ease-in-out hover:grayscale hover:opacity-70"
                    href="https://youtube.com/@layarHMSI" target="_blank"><img class="w-11"
                        src="/images/navbar/yt-logo.svg" alt="Youtube" /></a>
            </div>
        </div>
    </header>
    <script src="/js/mobileNav.js"></script>

    <!-- hapus h-[10000px] nya kalo mau add section ke bawah, ini diadakan hanya untuk cek effect scroll -->
    <main class="h-[10000px]">
        <!-- purely bg image doang -->
        <div
            class="fixed inset-0 -z-20 bg-cover bg-no-repeat bg-center bg-[url('/images/hero/bg-hero.png')] items-center justify-center">
        </div>

        <!-- dark overlay buat pas scroll -->
        <div id="bg-overlay" class="fixed inset-0 -z-10 bg-black opacity-0 pointer-events-none"></div>

        <!-- start hero -->
        <section class="w-full flex flex-col pt-[166px] md:pt-[270.5px] justify-center items-center gap-4">
            <div class="flex flex-col w-full h-full items-center justify-center">
                <h1
                    class="uppercase text-[4rem] md:text-[6rem] lg:text-[8rem] text-white [-webkit-text-stroke:1px_#7A3D21] lg:[-webkit-text-stroke:2px_#7A3D21] text-shadow-[0_5px_0_#7A3D21] lg:text-shadow-[0_10px_0_#7A3D21] leading-none">
                    IGNIS REALM</h1>
            </div>
            <div
                class="flex min-w-[338px] lg:w-[700.39px] aspect-[341/43] lg:aspect[701/63] items-center justify-center bg-[url(/images/hero/paper-scroll-hero-mobile.svg)] lg:bg-[url(/images/hero/paper-scroll-hero-desktop.svg)] bg-center bg-cover lg:bg-contain bg-no-repeat pb-1.5">
                <p class="text-[#7A3D21] text-[1.125rem] md:text-[2rem] lg:text-[2rem] font-times font-bold">Ini Tema
                </p>
            </div>
            <div class="flex w-full justify-center items-center transition-all duration-100 hover:brightness-90">
                <a href=""
                    class="px-[51px] py-[4px] md:px-[119.5px] md:py-[8px] bg-[linear-gradient(to_bottom,#F36F41_0%,#F39241_50%,#F36F41_50%,#F39241_100%)] rounded-[8px] border-[#F3B641] border-[1px] outline-[#592918] outline-[1px] drop-shadow-[0_8px_0_#592918]">
                    <p class="uppercase text-white text-[0.875rem] md:text-[1.75rem] md:leading-none">EXPLORE MORE</p>
                </a>
            </div>
        </section>
    </main>
    <script src="/js/bgScrollEffect.js"></script>
</body>

</html>
